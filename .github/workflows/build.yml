name: Compilar APK para Android

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Instalar dependencias
        run: flutter pub get

      - name: Forzar y limpiar Gradle
        run: |
          cd android
          ./gradlew clean
          cd ..

      - name: Compilar APK de liberacion (Release)
        run: flutter build apk --release --target-platform android-arm,android-arm64 --no-pub

      - name: Subir el APK como archivo descargable
        uses: actions/upload-artifact@v4
        with:
          name: app-streamer-release
          path: build/app/outputs/flutter-apk/app-release.apk
